analysis_task:
  description: >
    Analyze the software requirements for {project_name}. Your analysis should include:
    1. Functional requirements - What the system must do
    2. Non-functional requirements - Quality attributes (performance, scalability, security, availability, maintainability)
    4. Technical constraints - Technology stack preferences or other constraints specified in the SRS.

    Requirements to analyze: {requirements}

    Consider the current year {current_year} when evaluating technology choices and trends.
  expected_output: >
    A comprehensive requirements analysis document in markdown format containing:
    - Executive Summary
    - Functional Requirements (prioritized list)
    - Non-Functional Requirements (with measurable criteria)
    - Constraints and Assumptions
  agent: unified_agent

# Modeler
tech_stack_selection:
  description: >
    Select the technical stack for {project_name}, including programming languages and frameworks. Only select MUST third party technologies and strictly avoid over-design. You can select no additional technologies if you think it is unnecessary. Justify your choices based on project requirements and constraints.
    
    Functional Requirements: {fr}

    Non-Functional Requirements: {nfr}

    Constraints: {con}
  expected_output: >
    A technical stack selection document in markdown format containing:
    - Overview of selected technologies
    - Justifications for each choice
    - Comparison with alternatives
    - Risks and mitigation strategies
  agent: unified_agent

architectural_style_selection:
  description: >
    Choose the architectural style for {project_name} (e.g., microservices, monolith, event-driven).
    Justify your choice based on project requirements, constraints, and quality attributes.

    Functional Requirements: {fr}

    Non-Functional Requirements: {nfr}

    Constraints: {con}

    Selected Technical Stacks: {tech_stack}
  expected_output: >
    An architectural style selection document in markdown format containing:
    - Description of the chosen architectural style
    - Justifications for the choice
    - Comparison with alternatives
    - Risks and mitigation strategies
  agent: unified_agent

static_design:
  description: >
    Design the static structure of the system for {project_name}, including module decomposition and module relationships. Use UML diagrams to represent the design. Also, the designed modules should be mapped to the use cases in the functional requirements. Focus on the component-level module design with no concrete class-level implementation.
    
    Use the minimum number of components possible. If you can't explain why something can't be merged or removed, don't include it. No "future-proofing" or "extensibility" considerations—design only for the stated requirements.

    Functional Requirements: {fr}

    Constraints: {con}

    Selected Technical Stack: {tech_stack}

    Selected Architectural Style: {arch_style}
  expected_output: >
    A static design document in markdown format containing:
    - Module decomposition mapped to functional requirements, along with the corresponding UML package diagram
    - Component relationships
    - Justifications for design decisions
  agent: unified_agent

dynamic_design:
  description: >
    Identify the interfaces of the modules defined in the module design and specify the dynamic behavior of the system for {project_name}.

    1. Identify the public interfaces that each component should expose.
    2. Based on the identified interfaces, create a Component Diagram in plantuml showing the modules and their provided interfaces.
    3. Map each component to its corresponding functional requirements.

    Use the SIMPLEST design possible. If you can't explain why something can't be merged or removed, don't include it. No "future-proofing" or "extensibility" considerations—design only for the stated requirements.

    Functional Requirements: {fr}

    Constraints: {con}

    Module Design: {static_design}
  expected_output: >
    A dynamic design document in markdown format containing:
    - Interface definitions for each module
    - Component Diagram (UML) showing modules and interfaces
    - Mapping of modules to functional requirements
    - Justifications for design decisions
  agent: unified_agent

deployment_design:
  description: >
    Design the deployment architecture for {project_name}, including infrastructure topology,
    deployment strategies, and scalability considerations.

    Functional Requirements: {fr}

    Non-Functional Requirements: {nfr}

    Constraints: {con}
  expected_output: >
    A deployment design document in markdown format containing:
    - Infrastructure topology diagram
    - Deployment strategies
    - Scalability considerations
    - Justifications for design decisions
  agent: unified_agent



[project]
name = "reagent"
version = "0.1.0"
description = "REagent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.0",
    "prompt-toolkit==3.0.36",
]

[project.scripts]
reagent = "reagent.main:run"
run_crew = "reagent.main:run"
train = "reagent.main:train"
replay = "reagent.main:replay"
test = "reagent.main:test"
run_with_trigger = "reagent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

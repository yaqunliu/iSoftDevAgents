services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: isoftdev
      POSTGRES_USER: isoftdev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isoftdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 安全注释：
      # 默认只绑定回环地址。公网机器上把 5432 直接暴露出去，
      # 等于把带默认口令的数据库挂到互联网上。
      # 真的需要远程连库时，再把 ISOFTDEVAGENTS_PG_BIND_HOST 显式改成 0.0.0.0。
      - "${ISOFTDEVAGENTS_PG_BIND_HOST:-127.0.0.1}:${ISOFTDEVAGENTS_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isoftdev"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_HTTP_TIMEOUT: ${UV_HTTP_TIMEOUT:-600}
    restart: unless-stopped
    ports:
      # 安全注释：
      # 前端是通过 web 容器里的 Nginx 走 Docker 内网访问 backend 的，
      # 这里发布端口只是为了本机调试方便，所以默认同样只绑回环地址。
      - "${ISOFTDEVAGENTS_BACKEND_BIND_HOST:-127.0.0.1}:${ISOFTDEVAGENTS_BACKEND_PORT:-9010}:9010"
    environment:
      # 接口注释：
      # 这里统一从宿主机环境读取值；本地可以走 deploy/docker/run-local.sh，
      # 线上可以在 systemd / CI / 面板里注入同名环境变量。
      ISOFTDEVAGENTS_LLM_BASE_URL: ${ISOFTDEVAGENTS_LLM_BASE_URL:-}
      ISOFTDEVAGENTS_LLM_MODEL: ${ISOFTDEVAGENTS_LLM_MODEL:-gpt-5.4}
      ISOFTDEVAGENTS_LLM_API_KEY: ${ISOFTDEVAGENTS_LLM_API_KEY:-}
      ISOFTDEVAGENTS_ENABLE_REAGENT: ${ISOFTDEVAGENTS_ENABLE_REAGENT:-1}
      ISOFTDEVAGENTS_ENABLE_ARCH_AGENT: ${ISOFTDEVAGENTS_ENABLE_ARCH_AGENT:-1}
      ISOFTDEVAGENTS_ENABLE_UI_AGENT: ${ISOFTDEVAGENTS_ENABLE_UI_AGENT:-1}
      ISOFTDEVAGENTS_ENABLE_CODING_AGENT: ${ISOFTDEVAGENTS_ENABLE_CODING_AGENT:-1}
      ISOFTDEVAGENTS_ENABLE_TEST_AGENT: ${ISOFTDEVAGENTS_ENABLE_TEST_AGENT:-1}
      # 设计注释：
      # Docker 容器内不要继承宿主机 `.env` 里的绝对 Python 路径。
      # 这里显式置空，表示容器内一律走镜像自己的 Python / 自动探测结果。
      ISOFTDEVAGENTS_REAGENT_PYTHON_BIN: ""
      ISOFTDEVAGENTS_REAGENT_SITE_PACKAGES: ""
      ISOFTDEVAGENTS_ARCH_AGENT_PYTHON_BIN: ""
      ISOFTDEVAGENTS_CODING_AGENT_PYTHON_BIN: ""
      ISOFTDEVAGENTS_CODING_AGENT_SITE_PACKAGES: ""
      ISOFTDEVAGENTS_TEST_AGENT_SITE_PACKAGES: ""
      ISOFTDEVAGENTS_AGENT_TIMEOUT: ${ISOFTDEVAGENTS_AGENT_TIMEOUT:-3600}
      ISOFTDEVAGENTS_ANALYSIS_AGENT_TIMEOUT: ${ISOFTDEVAGENTS_ANALYSIS_AGENT_TIMEOUT:-3600}
      ISOFTDEVAGENTS_GENERATION_AGENT_TIMEOUT: ${ISOFTDEVAGENTS_GENERATION_AGENT_TIMEOUT:-3600}
      ISOFTDEVAGENTS_ARCHITECTURE_AGENT_TIMEOUT: ${ISOFTDEVAGENTS_ARCHITECTURE_AGENT_TIMEOUT:-3600}
      ISOFTDEVAGENTS_UI_AGENT_TIMEOUT: ${ISOFTDEVAGENTS_UI_AGENT_TIMEOUT:-3600}
      ISOFTDEVAGENTS_CODING_AGENT_TIMEOUT: ${ISOFTDEVAGENTS_CODING_AGENT_TIMEOUT:-3600}
      ISOFTDEVAGENTS_TEST_AGENT_TIMEOUT: ${ISOFTDEVAGENTS_TEST_AGENT_TIMEOUT:-3600}
      DATABASE_URL: ${DATABASE_URL:-postgresql://isoftdev:isoftdev@postgres:5432/isoftdev}
      # 资源注释：
      # 这四个是小内存单机的关键旋钮，之前 compose 没有透传，
      # 结果就是不管机器多小，后端都按"最多 8 个并发工作流 + 10 个 Agent 线程 +
      # 常驻 10 条 PG 连接"来跑。1~2G 内存的机器必须调到 1。
      # 默认值保持和代码里原本的默认一致，不改变已有部署的行为。
      ISOFTDEVAGENTS_MAX_CONCURRENT_WORKFLOWS: ${ISOFTDEVAGENTS_MAX_CONCURRENT_WORKFLOWS:-8}
      ISOFTDEVAGENTS_AGENT_EXECUTOR_MAX_WORKERS: ${ISOFTDEVAGENTS_AGENT_EXECUTOR_MAX_WORKERS:-10}
      ISOFTDEVAGENTS_PG_POOL_MIN: ${ISOFTDEVAGENTS_PG_POOL_MIN:-10}
      ISOFTDEVAGENTS_PG_POOL_MAX: ${ISOFTDEVAGENTS_PG_POOL_MAX:-50}
      ISOFTDEVAGENTS_DELETE_LOCAL_FILES_AFTER_PERSIST: ${ISOFTDEVAGENTS_DELETE_LOCAL_FILES_AFTER_PERSIST:-0}
      ISOFTDEVAGENTS_AGENT_DEBUG_STDIO: ${ISOFTDEVAGENTS_AGENT_DEBUG_STDIO:-1}
      ISOFTDEVAGENTS_AGENT_DEBUG_LLM_IO: ${ISOFTDEVAGENTS_AGENT_DEBUG_LLM_IO:-1}
      ISOFTDEVAGENTS_AGENT_DEBUG_LLM_LOG_TO_FILE: ${ISOFTDEVAGENTS_AGENT_DEBUG_LLM_LOG_TO_FILE:-1}
      ISOFTDEVAGENTS_AGENT_DEBUG_LLM_LOG_TO_CONSOLE: ${ISOFTDEVAGENTS_AGENT_DEBUG_LLM_LOG_TO_CONSOLE:-0}
      ISOFTDEVAGENTS_AGENT_DEBUG_LLM_LOG_FILE: /app/agent/platform/log/llm-debug.log
      ISOFTDEVAGENTS_AGENT_DEBUG_LLM_INPUT_LIMIT: ${ISOFTDEVAGENTS_AGENT_DEBUG_LLM_INPUT_LIMIT:-12000}
      ISOFTDEVAGENTS_AGENT_DEBUG_LLM_OUTPUT_LIMIT: ${ISOFTDEVAGENTS_AGENT_DEBUG_LLM_OUTPUT_LIMIT:-12000}
      ISOFTDEVAGENTS_AGENT_SHUTDOWN_WAIT_SECONDS: ${ISOFTDEVAGENTS_AGENT_SHUTDOWN_WAIT_SECONDS:-30}
      CREWAI_TRACING_ENABLED: ${CREWAI_TRACING_ENABLED:-false}
      VISION_AGENT_API_KEY: ${VISION_AGENT_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      ISOFTDEVAGENTS_IMAGE_LLM_API_KEY: ${ISOFTDEVAGENTS_IMAGE_LLM_API_KEY:-}
      ISOFTDEVAGENTS_IMAGE_LLM_BASE_URL: ${ISOFTDEVAGENTS_IMAGE_LLM_BASE_URL:-}
      ISOFTDEVAGENTS_IMAGE_LLM_MODEL: ${ISOFTDEVAGENTS_IMAGE_LLM_MODEL:-moonshot/kimi-k2.5}
    volumes:
      - ./agent/platform/data:/app/agent/platform/data
      - ./agent/platform/log:/app/agent/platform/log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9010/api/healthz', timeout=5).read()
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ""
        BASE_PATH: /
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        PNPM_FETCH_TIMEOUT: ${PNPM_FETCH_TIMEOUT:-600000}
        PNPM_FETCH_RETRIES: ${PNPM_FETCH_RETRIES:-5}
        # 资源注释：
        # 小内存机器上 vite build 容易被 OOM killer 杀掉（退出码 137）。
        # 给 V8 一个明确的堆上限，让它到点就 GC，而不是一路涨到把机器吃干。
        # 留空表示用 Node 默认行为（按可用内存自动推断）。
        NODE_OPTIONS: ${WEB_BUILD_NODE_OPTIONS:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 安全注释：
      # 公网流量一律从 caddy 进来（80/443），web 只保留一个本机端口供服务器上调试，
      # 所以这里和 postgres / backend 一样默认只绑回环地址。
      # 真要让 web 自己直接对外（例如临时回退到纯 HTTP），
      # 再把 ISOFTDEVAGENTS_WEB_BIND_HOST 显式改成 0.0.0.0、端口改成 80。
      - "${ISOFTDEVAGENTS_WEB_BIND_HOST:-127.0.0.1}:${ISOFTDEVAGENTS_WEB_PORT:-9080}:80"

  caddy:
    # 设计注释：
    # 这个容器是本次 HTTPS 方案的全部：它占住宿主机 80/443，自动签发和续期
    # Let's Encrypt 证书，然后反代到内网的 web:80。
    # 选它而不是给 nginx 配 certbot，是因为 nginx 的 443 server 块引用了
    # 还不存在的证书文件就起不来，而证书又得等 nginx 起来响应 ACME 挑战才签得出来——
    # 先有鸡还是先有蛋。Caddy 内置 ACME 客户端，没有这个问题。
    #
    # profiles 注释：
    # 挂了 https 这个 profile，默认的 `docker compose up` 不会带上它。
    # 服务器上靠 .env 里的 COMPOSE_PROFILES=https 打开；
    # 本地开发不设这个变量，就不会有一个容器在 Mac 上抢 80/443、
    # 也不会去给线上域名反复申请证书。
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      # 80 不只是用来做跳转，Let's Encrypt 的 HTTP-01 验证也走它，不能省。
      - "80:80"
      - "443:443"
    environment:
      ISOFTDEVAGENTS_SITE_DOMAIN: ${ISOFTDEVAGENTS_SITE_DOMAIN:-}
      ISOFTDEVAGENTS_ACME_EMAIL: ${ISOFTDEVAGENTS_ACME_EMAIL:-}
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # 关键：这两个必须是具名卷。
      # 证书就存在 caddy_data 里。容器重建但卷保留 → 不会重复签发 →
      # 不会撞上 Let's Encrypt「同一组域名每周 5 张」的速率限制。
      # 如果这里用匿名卷或干脆不挂卷，每次 up --build 都会重新签一次，
      # 五次之后这一周就签不出来了。
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:

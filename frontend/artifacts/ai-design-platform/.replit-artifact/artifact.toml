kind = "web"
previewPath = "/"
title = "AI Design Platform"
version = "1.0.0"
id = "artifacts/ai-design-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20347

[services.development]
run = "pnpm --filter @workspace/ai-design-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-design-platform", "run", "build" ]
publicDir = "artifacts/ai-design-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20347"
BASE_PATH = "/"
